name: Paper reproduction check

# Recomputes every number in the ASCEND 2027 paper from reproduce/ascend2027/results and compares it
# with the phrase the paper prints. Fetches the two third-party RUCoP contact plans (SHA-256 checked).

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths: [ "reproduce/**", ".github/workflows/reproduce.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "reproduce/**", ".github/workflows/reproduce.yml" ]

jobs:
  check-numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the RUCoP contact plans
        run: python3 reproduce/ascend2027/harness/fetch_rucop_plans.py
      - name: Check the paper's numbers
        run: python3 reproduce/ascend2027/check/check_numbers.py
      - name: Redraw the paper's plots
        run: |
          pip install matplotlib==3.9.4
          python3 reproduce/ascend2027/check/make_figures.py
