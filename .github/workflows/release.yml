name: Release

# Publishes an immutable, digest-addressable image for a version tag. CI builds and
# discards its image; without this workflow there is no artifact to deploy or roll back to.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up OpenJDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      # A tag must never publish an artifact that does not pass its own gates.
      - name: Run Full Test Lifecycle
        run: |
          mvn -B clean verify
          python3 -m pip install --upgrade pip setuptools
          python3 -m unittest discover -v

      - name: Verify Tag Matches Project Version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('pom.xml').read_text()
          print(re.search(r'<artifactId>dcn-pce-controller</artifactId>\s*<version>([^<]+)</version>', text).group(1).strip())
          ")
          echo "tag: ${tag_version} / pom.xml: ${pom_version}"
          if [ "${tag_version}" != "${pom_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the pom.xml version ${pom_version}."
            echo "::error::Set <version>${tag_version}</version> in pom.xml before tagging."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Build locally first. Pushing before the vulnerability gate publishes the digest to
      # GHCR whatever the gate then decides: a failed workflow still leaves a pullable image
      # behind, and deleting a published digest is not something a failing run can guarantee.
      - name: Build Image Locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vortex-pce-controller:release-candidate
          labels: ${{ steps.meta.outputs.labels }}

      - name: Report Vulnerabilities in the Release Candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vortex-pce-controller:release-candidate
          format: table
          output: trivy-release-scan.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      # The release path honours .trivyignore, so it must also honour the expiry dates in it.
      # Without this an exception that has gone stale still fails ordinary CI while silently
      # suppressing the same finding during a release -- the suppression outliving its review
      # exactly where it matters most.
      - name: Enforce Vulnerability Exception Review Dates
        run: python3 tools/check_vulnerability_exceptions.py .trivyignore

      # The enforcing gate, applied to the candidate before anything is published. A failure
      # here genuinely leaves nothing in the registry.
      #
      # CRITICAL,HIGH, matching the ordinary CI gate. It used to be CRITICAL alone while CI
      # enforced both, so a tagged release could publish an image that a routine pull request
      # would have been blocked for -- and the release path is the one that produces artifacts
      # other people consume. The step above already scanned for HIGH with exit-code 0, which
      # meant those findings were collected and ignored at exactly the wrong moment.
      #
      # If these two ever diverge again, the release policy is the weaker one and it wins by
      # default, so they are kept identical deliberately: severity, ignore-unfixed, and the
      # same .trivyignore with its expiry check.
      - name: Gate on Fixable Critical and High Findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vortex-pce-controller:release-candidate
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      # Same context and arguments as the local build, so this is a cache hit rather than a
      # second compilation: the digest published is the content the gate just cleared.
      - name: Push Gated Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The default docker driver cannot attach BuildKit attestations ("Attestation is not
          # supported for the docker driver"), and switching to a container driver would lose the
          # shared daemon cache that makes this push publish exactly the image the gate cleared.
          # Provenance is not lost: "Attest Build Provenance" below signs it for this digest and
          # pushes it to the registry.
          provenance: false

      - name: Generate Release SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: vortex-pce-controller.sbom.spdx.json
          upload-artifact: false

      # Signs the published digest, so a consumer can verify the image came from this
      # workflow on this repository rather than trusting the tag alone.
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            vortex-pce-controller.sbom.spdx.json
            trivy-release-scan.txt
          body: |
            ## Image

            ```
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
            ```

            Pull by digest rather than tag for a reproducible deployment.
            Build provenance is attested and pushed to the registry; verify with:

            ```
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} --repo ${{ github.repository }}
            ```

            The attached SBOM (SPDX JSON) and image vulnerability scan describe this exact digest.

            This remains a research prototype. See the README for the capabilities that are
            not yet wired end to end.
