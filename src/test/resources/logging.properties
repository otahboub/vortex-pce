# Test logging. The controller's own logging is unchanged; this only governs what a test run
# prints.
#
# A focused Maven run emitted over 2.5 MB and nearly 5,000 INFO lines -- planner progress, WAL
# compaction, and the deliberate failures that negative-path tests exercise. That volume buries
# the one line that matters when something breaks, and it fills CI log retention with output
# nobody reads. Warnings and above still print, so a test that provokes a real problem still says
# so.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %4$s %2$s: %5$s%6$s%n

# The controller's packages, quiet unless something is wrong.
net.dcn.pce.level = WARNING

# Negative-path tests deliberately corrupt logs, drop sessions and fail writes. Their warnings are
# the expected result of the test rather than a signal, and they are the bulk of what remains at
# WARNING, so these two are quieter still. A test asserting on such a failure asserts on the
# outcome, not on the log line.
net.dcn.pce.rib.FileWalReservationStore.level = SEVERE
net.dcn.pce.pcep.PcepSessionServer.level = SEVERE
