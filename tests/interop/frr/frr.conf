segment-routing
 traffic-eng
  pcep
   pce-config CFG
    source-address ip 172.29.0.3
    source-address ipv6 ::1
    ! pathd refuses every PCE-initiated LSP unless this is set, with
    ! error 24/1 'unacceptable instantiation parameters' -- which reads like a
    ! complaint about the request rather than a policy that forbids the whole
    ! operation. Without it no dispatch test can ever succeed.
    pce-initiated
   !
   pce PCE1
    address ip 172.29.0.2
    config CFG
   !
   pcc
    peer PCE1 precedence 10
   !
  !
 !
!
